name: Verify CI
run-name: "Verify ${{ github.event.pull_request && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('`{0}` on {1}', github.event.head_commit.message, github.ref) }}"

on:
  pull_request:
    branches: [main]
  push:
  workflow_call:
  workflow_dispatch:
    inputs:
      DEBUG:
        type: choice
        default: 'false'
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: 24

jobs:
  verify:
    needs:
      - test-dank
      - verify-dank
      - verify-create-dank
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Do you like green eggs and ham?'

  test-dank:
    strategy:
      matrix:
        os: [macos, ubuntu, windows]
    name: 'test-dank-${{ matrix.os }}'
    runs-on: '${{ matrix.os }}-latest'
    env:
      DEBUG: ${{ inputs.DEBUG || 'false'}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - run: pnpm build
      - run: pnpm test --test-concurrency=1

  verify-dank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - run: pnpm build:release
      - run: pnpm fmtcheck

  verify-create-dank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - working-directory: create-dank
        run: pnpm build
      - working-directory: create-dank
        run: pnpm fmtcheck
